<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset your password</title>
</head>
<body>
<h1>Reset your password</h1>
<p>Your password reset code is <strong th:text="${code}">000000</strong>.</p>
<p>This code expires in <span th:text="${expirationMinutes}">5</span> minutes.
    If you did not request a password reset, ignore this email.</p>
</body>
</html>
